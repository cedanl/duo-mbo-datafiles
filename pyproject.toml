[project]
name = "duo-mbo-datafiles"
version = "0.1.0"
description = "Parsers en analyse voor DUO MBO bestandsformaten (H15 RO, H16 TBGI, H17 GRONDSLAG_IP)"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
